<main class="min-h-screen bg-slate-50 px-4 py-8 text-slate-950 sm:px-6 lg:px-8">
  <section class="mx-auto grid min-h-[calc(100vh-4rem)] w-full max-w-6xl items-center gap-10 lg:grid-cols-[1fr_420px]">
    <div class="hidden lg:block">
      <img src="/assets/logo.jpg" alt="RBS Chemical" class="h-auto w-56 object-contain" />

      <div class="mt-12 max-w-xl">
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-sky-700">Client Portal</p>
        <h1 class="mt-4 text-5xl font-semibold leading-tight text-slate-950">
          Simple access for daily business.
        </h1>
        <p class="mt-5 text-base leading-7 text-slate-600">
          Sign in to continue managing your RBS Chemical client workspace.
        </p>
      </div>
    </div>

    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <div class="mb-8">
        <img src="/assets/logo.jpg" alt="RBS Chemical" class="h-auto w-40 object-contain lg:hidden" />
        <p class="mt-8 text-sm font-semibold uppercase tracking-[0.18em] text-sky-700 lg:mt-0">
          Welcome back
        </p>
        <h2 class="mt-3 text-2xl font-semibold text-slate-950">Sign in to your account</h2>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="signIn()" class="space-y-5" novalidate>
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="name@company.com"
            class="h-12 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-950 outline-none transition focus:border-sky-600 focus:ring-4 focus:ring-sky-100"
            [class.border-red-500]="emailInvalid()"
          />
          @if (emailInvalid()) {
            <p class="mt-2 text-sm font-medium text-red-600">Enter a valid email address.</p>
          }
        </div>

        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            class="h-12 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-950 outline-none transition focus:border-sky-600 focus:ring-4 focus:ring-sky-100"
            [class.border-red-500]="passwordInvalid()"
          />
          @if (passwordInvalid()) {
            <p class="mt-2 text-sm font-medium text-red-600">
              Password must be at least 6 characters.
            </p>
          }
        </div>

        <div class="flex flex-col gap-3 text-sm sm:flex-row sm:items-center sm:justify-between">
          <label class="inline-flex items-center gap-2 font-medium text-slate-600">
            <input
              type="checkbox"
              formControlName="rememberMe"
              class="h-4 w-4 rounded border-slate-300 text-sky-700 focus:ring-sky-600"
            />
            <span>Remember me</span>
          </label>
          <a href="/login" class="font-semibold text-sky-700 hover:text-sky-800">Forgot password?</a>
        </div>

        <button
          type="submit"
          class="h-12 w-full rounded-lg bg-slate-950 text-sm font-semibold text-white transition hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-200"
        >
          Sign in
        </button>
      </form>
    </div>
  </section>
</main>
