<div class="mx-auto max-w-6xl">
  <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-sky-700">Module</p>
      <h1 class="mt-1 text-2xl font-semibold text-slate-950">{{ routeData().title }}</h1>
      <p class="mt-1 text-sm text-slate-500">{{ routeData().description }}</p>
    </div>

    <button
      type="button"
      class="h-9 rounded-md bg-slate-950 px-3 text-sm font-semibold text-white transition hover:bg-slate-800"
    >
      Add new
    </button>
  </div>

  <div class="grid gap-3 sm:grid-cols-3">
    <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-xs font-medium text-slate-500">Total</p>
      <p class="mt-2 text-2xl font-semibold text-slate-950">128</p>
    </section>
    <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-xs font-medium text-slate-500">Active</p>
      <p class="mt-2 text-2xl font-semibold text-slate-950">94</p>
    </section>
    <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-xs font-medium text-slate-500">Pending</p>
      <p class="mt-2 text-2xl font-semibold text-slate-950">12</p>
    </section>
  </div>

  <section class="mt-4 overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
      <h2 class="text-sm font-semibold text-slate-950">Recent records</h2>
      <input
        type="search"
        placeholder="Search"
        class="h-8 w-44 rounded-md border border-slate-200 px-2 text-sm outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100"
      />
    </div>

    <div class="divide-y divide-slate-100">
      @for (record of ['RBS-1001', 'RBS-1002', 'RBS-1003', 'RBS-1004']; track record) {
        <div class="grid grid-cols-[1fr_auto] items-center gap-3 px-4 py-3">
          <div>
            <p class="text-sm font-medium text-slate-950">{{ record }}</p>
            <p class="text-xs text-slate-500">Updated today</p>
          </div>
          <span class="rounded-md bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700">
            Active
          </span>
        </div>
      }
    </div>
  </section>
</div>
