<div class="-m-4 flex h-[calc(100vh-3.5rem)] flex-col overflow-hidden bg-white sm:-m-6">
  <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3 sm:px-5">
    <div class="flex min-w-0 items-center gap-3">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-md bg-slate-950 text-white shadow-sm">
        <svg lucideSparkles size="19" strokeWidth="2.2"></svg>
      </span>
      <div class="min-w-0">
        <h1 class="truncate text-base font-semibold text-slate-950">{{ assistantName }}</h1>
        <p class="truncate text-xs text-slate-500">RBS business assistant</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span class="hidden items-center gap-1.5 rounded-md border border-emerald-200 bg-emerald-50 px-2.5 py-1.5 text-xs font-semibold text-emerald-700 sm:inline-flex">
        <svg lucideBrainCircuit size="14" strokeWidth="2.2"></svg>
        {{ isAsking() ? 'Thinking' : 'Online' }}
      </span>
      <button
        type="button"
        class="inline-flex h-8 items-center gap-1.5 rounded-md border border-slate-200 px-2.5 text-xs font-semibold text-slate-600 transition hover:bg-slate-100"
        (click)="clearChat()"
      >
        <svg lucidePanelTop size="14" strokeWidth="2.2"></svg>
        New
      </button>
    </div>
  </header>

  <section #messageScroller class="flex-1 overflow-y-auto bg-slate-50 px-3 py-4 sm:px-5">
    <div class="mx-auto flex max-w-3xl flex-col gap-5">
      @for (message of messages(); track $index) {
        <article
          class="flex gap-3"
          [class.justify-end]="message.role === 'user'"
        >
          @if (message.role === 'assistant') {
            <span class="mt-1 grid h-8 w-8 shrink-0 place-items-center rounded-md bg-slate-950 text-white">
              <svg lucideSparkles size="15" strokeWidth="2.2"></svg>
            </span>
          }

          <div
            class="max-w-[min(42rem,calc(100%-3rem))] whitespace-pre-line rounded-lg px-4 py-3 text-sm leading-6 shadow-sm"
            [class.bg-white]="message.role === 'assistant'"
            [class.text-slate-700]="message.role === 'assistant'"
            [class.border]="message.role === 'assistant'"
            [class.border-slate-200]="message.role === 'assistant'"
            [class.bg-slate-950]="message.role === 'user'"
            [class.text-white]="message.role === 'user'"
          >
            {{ message.text }}
          </div>
        </article>
      }

      @if (isAsking()) {
        <article class="flex gap-3">
          <span class="mt-1 grid h-8 w-8 shrink-0 place-items-center rounded-md bg-slate-950 text-white">
            <svg lucideSparkles size="15" strokeWidth="2.2"></svg>
          </span>
          <div class="rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm text-slate-500 shadow-sm">
            Thinking...
          </div>
        </article>
      }
    </div>
  </section>

  <footer class="border-t border-slate-200 bg-white p-3 sm:p-4">
    <div class="mx-auto max-w-3xl space-y-3">
      <div class="flex gap-2 overflow-x-auto pb-1">
        @for (suggestion of suggestions; track suggestion.label) {
          <button
            type="button"
            class="inline-flex shrink-0 items-center rounded-md border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:border-sky-200 hover:bg-sky-50 hover:text-sky-700 disabled:cursor-not-allowed disabled:opacity-60"
            (click)="useSuggestion(suggestion)"
            [disabled]="isAsking()"
          >
            {{ suggestion.label }}
          </button>
        }
      </div>

      <div class="chat-composer" [class.has-prompt]="prompt.trim()">
        <textarea
          #promptInput
          [(ngModel)]="prompt"
          rows="1"
          class="chat-composer-input"
          placeholder="Ask anything"
          [disabled]="isAsking()"
          (input)="resizePromptInput($event)"
        ></textarea>
        <button
          type="button"
          class="chat-composer-send"
          (click)="generateResponse()"
          [disabled]="isAsking() || !prompt.trim()"
          aria-label="Send message"
        >
          <svg lucideSendHorizontal size="17" strokeWidth="2.2"></svg>
        </button>
      </div>
    </div>
  </footer>
</div>
